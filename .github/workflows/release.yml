name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up Rust
        run: rustup toolchain install 1.85.0 --profile minimal

      - name: Test native Rust compiler
        run: cargo +1.85.0 test --locked --manifest-path packages/compiler/native/Cargo.toml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release readiness
        run: pnpm release:check

      - name: Upload font regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: font-regression-diagnostics
          path: .artifacts/font-regression
          if-no-files-found: ignore
          retention-days: 14

      - name: Build playground
        if: github.event_name == 'push'
        run: pnpm --filter @yuragi-labs/playground build:vite

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/playground/dist

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Release with Tegami
        run: pnpm tegami ci
        env:
          GITHUB_TOKEN: ${{ github.token }}

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
