name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Prepare Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.85.0 fetch --locked --manifest-path packages/compiler/native/Cargo.toml
          cargo +1.85.0 fetch --locked --manifest-path experiments/wasm-compiler/Cargo.toml --target wasm32-unknown-unknown

      - name: Audit native Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: advisories
          manifest-path: packages/compiler/native/Cargo.toml

      - name: Audit WASM Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: advisories
          manifest-path: experiments/wasm-compiler/Cargo.toml

      - name: Test native Rust compiler
        run: cargo +1.85.0 test --locked --manifest-path packages/compiler/native/Cargo.toml

      - name: Install dependencies
        run: pnpm install

      - name: Cache Source Han Serif fixture
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/yuragi/fonts/SourceHanSerifSC-VF.otf
          key: ${{ runner.os }}-source-han-serif-2.003R-24980e3fdbdf7cbef800133c9bc8937cb65533ca50f0bd0565115db496f57220

      - name: Build packages and examples
        run: pnpm examples:build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Upload font regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: font-regression-diagnostics
          path: .artifacts/font-regression
          if-no-files-found: ignore
          retention-days: 14

      - name: Build playground
        run: pnpm playground:build
