name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown

      - name: Test native Rust compiler
        run: cargo +1.85.0 test --locked --manifest-path packages/compiler/native/Cargo.toml

      - name: Install dependencies
        run: pnpm install

      - name: Build packages and examples
        run: pnpm examples:build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Upload font regression diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: font-regression-diagnostics
          path: .artifacts/font-regression
          if-no-files-found: ignore
          retention-days: 14

      - name: Build playground
        run: pnpm playground:build
