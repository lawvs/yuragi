[package]
name = "yuragi-wasm-compiler"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
anyhow = "1.0.103"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
yuragi-compiler = { path = "../../compiler/native", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
