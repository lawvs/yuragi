[package]
name = "yuragi-compiler"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:serde_json", "dep:sha2"]

[[bin]]
name = "yuragi-compiler"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.5.38", features = ["derive"], optional = true }
itertools = "0.14.0"
lyon_algorithms = "1.0.5"
lyon_path = "1.0.6"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", optional = true }
sha2 = { version = "0.10.9", optional = true }
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.12.0"
